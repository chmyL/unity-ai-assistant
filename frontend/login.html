<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>登录 - Unity AI 助手</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#9acbff",
                        "on-primary": "#003355",
                        "background": "#0b1326",
                        "on-background": "#dae2fd",
                        "surface-container-low": "#131b2e",
                        "surface-container": "#171f33",
                        "surface-container-high": "#222a3d",
                        "surface-container-highest": "#2d3449",
                        "on-surface": "#dae2fd",
                        "on-surface-variant": "#bec7d4",
                        "outline-variant": "#3f4852",
                        "error": "#ffb4ab",
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["JetBrains Mono"],
                    },
                    "fontSize": {
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-sm": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b1326; color: #dae2fd; font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-[400px] bg-surface-container-low border border-outline-variant rounded-2xl shadow-2xl p-8">

        <!-- 标题 -->
        <div class="flex flex-col items-center mb-8">
            <span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">
                smart_toy
            </span>
            <h1 class="mt-3 font-headline-lg text-headline-lg text-on-surface">Unity AI 助手</h1>
            <p id="auth-subtitle" class="mt-1 font-label-sm text-label-sm text-on-surface-variant">登录以继续</p>
        </div>

        <!-- Tab 切换 -->
        <div class="flex mb-6 bg-surface-container-highest rounded-lg p-1">
            <button id="auth-tab-login" type="button"
                    class="flex-1 py-2 rounded-md font-label-sm text-label-sm transition-all bg-primary text-on-primary font-bold">
                登录
            </button>
            <button id="auth-tab-register" type="button"
                    class="flex-1 py-2 rounded-md font-label-sm text-label-sm transition-all text-on-surface-variant hover:text-on-surface">
                注册
            </button>
        </div>

        <!-- 表单 -->
        <form id="auth-form" class="space-y-4" autocomplete="off">

            <div>
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1">用户名</label>
                <input id="auth-username" type="text" placeholder="请输入用户名" autocomplete="username"
                       class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-2.5 px-3 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary">
            </div>

            <div>
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1">密码</label>
                <input id="auth-password" type="password" placeholder="请输入密码" autocomplete="current-password"
                       class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-2.5 px-3 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary">
            </div>

            <div id="auth-confirm-wrapper" class="hidden">
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1">确认密码</label>
                <input id="auth-confirm" type="password" placeholder="请再次输入密码" autocomplete="new-password"
                       class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-2.5 px-3 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary">
            </div>

            <div id="auth-error" class="hidden text-error font-label-sm text-label-sm text-center py-1"></div>

            <button id="auth-submit" type="submit"
                    class="w-full bg-primary text-on-primary font-label-sm text-label-sm font-bold py-2.5 rounded-lg hover:brightness-110 active:scale-95 transition-all">
                登录
            </button>
        </form>

        <!-- 底部切换 -->
        <p class="mt-6 text-center font-label-sm text-label-sm text-on-surface-variant">
            <span id="auth-footer-text">还没有账号？</span>
            <button id="auth-footer-switch" type="button" class="text-primary hover:underline">立即注册</button>
        </p>

    </div>

    <script>
        let authMode = "login";

        const authForm         = document.getElementById('auth-form');
        const authUsername     = document.getElementById('auth-username');
        const authPassword     = document.getElementById('auth-password');
        const authConfirm      = document.getElementById('auth-confirm');
        const authConfirmWrap  = document.getElementById('auth-confirm-wrapper');
        const authError        = document.getElementById('auth-error');
        const authSubmit       = document.getElementById('auth-submit');
        const authSubtitle     = document.getElementById('auth-subtitle');
        const authFooterText   = document.getElementById('auth-footer-text');
        const authFooterSwitch = document.getElementById('auth-footer-switch');
        const authTabLogin     = document.getElementById('auth-tab-login');
        const authTabRegister  = document.getElementById('auth-tab-register');

        function setAuthMode(mode) {
            authMode = mode;
            authError.classList.add('hidden');
            authError.innerText = '';

            if (mode === 'login') {
                authSubtitle.innerText = '登录以继续';
                authConfirmWrap.classList.add('hidden');
                authSubmit.innerText = '登录';
                authFooterText.innerText = '还没有账号？';
                authFooterSwitch.innerText = '立即注册';
                authTabLogin.className = 'flex-1 py-2 rounded-md font-label-sm text-label-sm transition-all bg-primary text-on-primary font-bold';
                authTabRegister.className = 'flex-1 py-2 rounded-md font-label-sm text-label-sm transition-all text-on-surface-variant hover:text-on-surface';
            } else {
                authSubtitle.innerText = '创建新账号';
                authConfirmWrap.classList.remove('hidden');
                authSubmit.innerText = '注册';
                authFooterText.innerText = '已经有账号？';
                authFooterSwitch.innerText = '去登录';
                authTabLogin.className = 'flex-1 py-2 rounded-md font-label-sm text-label-sm transition-all text-on-surface-variant hover:text-on-surface';
                authTabRegister.className = 'flex-1 py-2 rounded-md font-label-sm text-label-sm transition-all bg-primary text-on-primary font-bold';
            }

            authUsername.value = '';
            authPassword.value = '';
            authConfirm.value = '';
            authUsername.focus();
        }

        function showAuthError(msg) {
            authError.innerText = msg;
            authError.classList.remove('hidden');
        }

        authTabLogin.addEventListener('click', () => setAuthMode('login'));
        authTabRegister.addEventListener('click', () => setAuthMode('register'));
        authFooterSwitch.addEventListener('click', () => {
            setAuthMode(authMode === 'login' ? 'register' : 'login');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');

            const username = authUsername.value.trim();
            const password = authPassword.value;

            if (!username) return showAuthError('请输入用户名');
            if (!/^[a-zA-Z0-9_\-]+$/.test(username)) return showAuthError('用户名只能包含字母、数字、下划线、连字符');
            if (username.length < 2 || username.length > 32) return showAuthError('用户名长度需在 2~32 之间');
            if (!password) return showAuthError('请输入密码');
            if (password.length < 4) return showAuthError('密码至少 4 位');

            if (authMode === 'register') {
                if (password !== authConfirm.value) return showAuthError('两次输入的密码不一致');
            }

            authSubmit.disabled = true;
            authSubmit.innerText = authMode === 'login' ? '登录中...' : '注册中...';

            try {
                const url = authMode === 'login' ? '/api/login' : '/api/register';
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: username, password: password })
                });
                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || data.detail || '操作失败');
                }

                // 登录成功 → 存 userId + 管理员标记 → 跳主界面
                localStorage.setItem("currentUserId", username);
                localStorage.setItem("isAdmin", data.is_admin ? "1" : "0");
                window.location.href = '/app';

            } catch (err) {
                showAuthError(err.message || '网络错误');
            } finally {
                authSubmit.disabled = false;
                authSubmit.innerText = authMode === 'login' ? '登录' : '注册';
            }
        });

<!--        // 如果有已登录用户，自动跳转-->
<!--        if (localStorage.getItem("currentUserId")) {-->
<!--            window.location.href = '/app';-->
<!--        }-->

        authUsername.focus();
    </script>

</body>
</html>
